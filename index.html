<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8"><title>절대중립 | 길드</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c7270'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='23' fill='white'%3E중%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=20261004-12">
  <script src="vendor/lucide.min.js" defer></script><script src="app.js?v=20261004-12" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 이동</a>
  <aside class="sidebar">
    <div class="game-brand"><img src="assets/zeus-wordmark.png" alt="ZEUS" width="180" height="69"><span>제우스: 오만의 신</span></div>
    <a href="#rules" class="guild-brand"><span class="guild-emblem"><img src="assets/guild-emblem.png" alt="" width="48" height="48"></span><span><strong>절대중립</strong><small>아테나2</small></span></a>
    <nav aria-label="메인 메뉴">
      <button data-tab="rules" class="active"><i data-lucide="book-open"></i><span>운영 방식</span></button>
      <button data-tab="notices"><i data-lucide="megaphone"></i><span>공지사항</span></button>
      <button data-tab="members"><i data-lucide="users-round"></i><span>길드원 참여 현황</span></button>
      <button data-tab="distribution"><i data-lucide="package-open"></i><span>분배 기록</span></button>
      <button data-tab="tips"><i data-lucide="messages-square"></i><span>팁 공유</span></button>
      <button data-tab="tools"><i data-lucide="sliders-horizontal"></i><span>편의 기능</span></button>
    </nav>
    <div class="sidebar-foot"><span class="guild-dot"></span><span>절대중립 길드</span></div>
  </aside>
  <div class="workspace">
    <header class="workspace-bar"><div><span>길드</span><i data-lucide="chevron-right"></i><strong id="current-view">운영 방식</strong></div></header>
    <main id="main-content" tabindex="-1">
      <p id="loading" role="status">길드 정보를 불러오는 중입니다.</p>
      <section id="rules" hidden>
        <div class="page-heading"><div><h1>운영 방식</h1><p>함께 활동하는 길드의 약속</p></div><span class="date-label"><i data-lucide="calendar-days"></i>2026.10.02 공지</span></div>
        <div class="chapter-navigation" aria-label="운영 규칙 목차"><button data-scroll="guild-operations">길드 운영</button><button data-scroll="guild-distribution">분배 기준</button><button data-scroll="guild-allocation">아이템 분배</button></div>
        <div id="rule-content"></div>
      </section>
      <section id="notices" hidden>
        <div class="page-heading"><div><h1>공지사항</h1><p>길드 일정과 운영 소식</p></div><div class="notice-actions"><button id="notice-logout" class="secondary-button" type="button" hidden>로그아웃</button><button id="new-notice" class="primary-button" type="button" aria-expanded="false"><i data-lucide="square-pen"></i>글쓰기</button></div></div>
        <form id="notice-login" class="tip-form notice-login" hidden><h2>관리자 로그인</h2><label>비밀번호<input name="password" type="password" autocomplete="current-password" maxlength="200" required></label><div class="form-actions"><span id="notice-login-status" role="status"></span><button id="cancel-notice-login" class="secondary-button" type="button">취소</button><button class="primary-button" type="submit">로그인</button></div></form>
        <form id="notice-form" class="tip-form" hidden><h2 id="notice-form-heading">새 공지</h2><div class="form-fields"><label class="full-field">제목<input name="title" maxlength="100" required></label><label class="full-field">내용<textarea name="content" rows="7" maxlength="5000" required></textarea></label></div><div class="form-actions"><span id="notice-form-status" role="status"></span><button id="cancel-notice" class="secondary-button" type="button">취소</button><button class="primary-button" type="submit">등록</button></div></form>
        <div class="board-toolbar"><span id="notice-count"></span><button id="refresh-notices" class="icon-button" type="button" aria-label="공지 새로고침" title="새로고침"><i data-lucide="refresh-cw"></i></button></div><p id="notices-status" role="status"></p>
        <div class="board-column-head"><span>제목</span><span>작성일</span></div>
        <div id="notices-list" class="notice-list"></div>
      </section>
      <section id="members" hidden>
        <div class="page-heading"><div><h1>길드원 참여 현황</h1><p>길드 콘텐츠 참여 기록</p></div><span id="member-count" class="count-label"></span></div>
        <div class="toolbar"><label class="search-field"><i data-lucide="search"></i><input id="search" type="search" placeholder="닉네임 검색" aria-label="닉네임 검색"></label><span class="legend"><b class="yes">ㅇ 참여</b><b class="no">x 미참여</b><b class="pending">- 가입 전 / 미기록</b></span></div>
        <div class="member-grid"><div class="member-group-bar"><span>길드원</span><span>단톡</span><span>길드 컨텐츠</span></div><div class="table-scroll"><table id="member-table"></table></div></div><p id="empty-search" hidden>검색 결과가 없습니다.</p>
      </section>
      <section id="distribution" hidden><div class="page-heading"><div><h1>분배 기록</h1><p>회차별 아이템과 낙찰 내역</p></div><span class="date-label"><i data-lucide="arrow-down-wide-narrow"></i>최신 회차순</span></div><div id="distribution-content"></div></section>
      <section id="tips" hidden>
        <div class="page-heading"><div><h1>팁 공유</h1><p>함께 나누는 공략과 유용한 링크</p></div><button id="new-tip" class="primary-button" type="button" aria-expanded="false" aria-controls="tip-form"><i data-lucide="square-pen"></i>글쓰기</button></div>
        <form id="tip-form" class="tip-form" hidden><h2>새 팁</h2><div class="form-fields"><label>제목<input name="title" maxlength="100" required></label><label>닉네임<input name="author" maxlength="30" placeholder="익명"></label><label class="full-field">링크<input name="url" type="url" maxlength="2000" placeholder="https://"></label><label class="full-field">내용<textarea name="content" rows="5" maxlength="5000" required></textarea></label><label class="full-field">수정·삭제 비밀번호<input name="password" type="password" minlength="4" maxlength="128" autocomplete="new-password" required></label></div><div class="form-actions"><span id="tip-form-status" role="status"></span><button id="cancel-tip" type="button" class="secondary-button">취소</button><button type="submit" class="primary-button">등록</button></div></form>
        <div class="board-toolbar"><span id="tip-count"></span><button id="refresh-tips" class="icon-button" type="button" aria-label="새로고침" title="새로고침"><i data-lucide="refresh-cw"></i></button></div><p id="tips-status" role="status"></p><div id="tips-list" class="tips-list"></div>
      </section>
      <section id="tools" hidden>
        <div class="page-heading"><div><h1>편의 기능</h1></div></div>
        <div class="calculator-tabs" role="tablist" aria-label="계산기">
          <button id="collection-tab" data-calculator="collection" role="tab" aria-selected="true" aria-controls="collection-panel" class="active" type="button">컬렉션 기대값 계산기</button>
          <button id="skill-tab" data-calculator="skill" role="tab" aria-selected="false" aria-controls="skill-panel" tabindex="-1" type="button">스킬 강화 기대값 계산기</button>
        </div>
        <div id="collection-panel" class="calculator-panel" role="tabpanel" aria-labelledby="collection-tab"></div>
        <div id="skill-panel" class="calculator-panel" role="tabpanel" aria-labelledby="skill-tab" hidden></div>
      </section>
    </main>
    <footer>절대중립<span>아테나2 길드</span></footer>
  </div>
</body>
</html>
