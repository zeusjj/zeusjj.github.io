name: Refresh official news
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-news.yml'
      - '.github/scripts/collect-official-news.mjs'
permissions:
  contents: write
  pages: write
concurrency:
  group: official-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect recent official posts
        run: node .github/scripts/collect-official-news.mjs official-news.json
      - name: Save refreshed list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add official-news.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh recent official news'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish updated list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds"
