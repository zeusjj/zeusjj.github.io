<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Guild DB Import</title>
</head>
<body>
  <header id="header-nickname"></header>
  <p id="member-auth-status" role="status"></p>
  <div class="member-login-mount" id="local-login"></div>
  <dialog id="member-password-dialog">
    <form id="member-password-form">
      <input name="password" type="password">
      <input name="confirmPassword" type="password">
      <button id="member-password-close" type="button">Close</button>
      <button type="submit">Save</button>
      <p id="member-password-status"></p>
    </form>
  </dialog>
  <main>
    <h1>Guild data snapshot import</h1>
    <button id="import" type="button" disabled>Import snapshot</button>
    <pre id="status" role="status">Waiting for administrator session.</pre>
  </main>
  <script type="module">
    import './member-auth.js';
    const status=document.getElementById('status'),button=document.getElementById('import');
    const api='https://zeusjj-guild-tips.e049eed7-30f4-430d-991a-7eef07fecebb.chatgpt.site/api';
    function update(){const user=window.GuildAuth?.user;button.disabled=!user?.isAdmin;status.textContent=user?.isAdmin?'Administrator session ready.':'Waiting for administrator session.';}
    window.addEventListener('guild-auth-change',update);const restoreTimer=setInterval(()=>{update();if(window.GuildAuth?.user)clearInterval(restoreTimer);},250);update();
    button.addEventListener('click',async()=>{
      if(!window.GuildAuth?.user?.isAdmin)return;
      button.disabled=true;status.textContent='Importing snapshot...';
      let stage='reading the local snapshot';
      try{
        const snapshotResponse=await fetch('/growth-import-local.json',{cache:'no-store'});if(!snapshotResponse.ok)throw new Error(`Snapshot request failed (${snapshotResponse.status}).`);const snapshot=await snapshotResponse.json();
        if(!snapshot.revision||!snapshot.data?.headers||!snapshot.data?.members)throw new Error('Invalid snapshot format.');
        stage='checking administrator database access';
        const currentResponse=await fetch(api+'/admin/guild-data',{headers:window.GuildAuth.headers(),cache:'no-store'});if(!currentResponse.ok)throw new Error(`Database check returned ${currentResponse.status}.`);
        const current=await currentResponse.json();if(current.revision!==snapshot.revision)throw new Error('Snapshot is stale; refresh it from the live database before importing.');
        stage='submitting to the live database';
        const response=await fetch(api+'/admin/guild-data',{method:'PUT',headers:{...window.GuildAuth.headers(),'Content-Type':'application/json'},body:JSON.stringify(snapshot),cache:'no-store'});
        const result=await response.json();if(!response.ok)throw new Error(result.error||`Import failed (${response.status}).`);
        stage='verifying the live database';
        const live=await (await fetch(api+'/guild-data',{cache:'no-store'})).json();
        status.textContent=JSON.stringify({imported:true,revision:result.revision,liveRevision:live.sourceRevision,members:live.members?.length,headers:live.headers?.length},null,2);
      }catch(error){status.textContent=`Failed while ${stage}: ${error.message}`;button.disabled=false;}
    });
  </script>
</body>
</html>
